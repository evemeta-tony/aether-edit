# /etc/aether-edit/aether-nats.conf
# Dedicated NATS JetStream broker for aether-edit (isolated from the
# shared nats-server :4222 and fern2-nats :14222). Loopback only.
host: "127.0.0.1"
port: 9214
http: "127.0.0.1:9215"
server_name: aether-edit-nats
jetstream {
  store_dir: "/var/lib/aether-edit/nats"
  max_memory_store: 268435456
  max_file_store: 5368709120
}
