# /etc/nginx/sites-available/transcoder.evemeta.com
# aether-edit public surface. ADDITIVE vhost, named server only, never a
# default_server. LOGIN GATE (Tony): the entire surface sits behind HTTP
# basic auth until FT-6a OIDC login and the real consoles land, so the
# public URL is never openly usable. When OIDC is live, the auth_basic
# lines come off and OIDC becomes the gate.
server {
    listen 80;
    listen [::]:80;
    server_name transcoder.evemeta.com;
    # ACME challenge for certbot, then redirect to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/aether-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name transcoder.evemeta.com;

    ssl_certificate     /etc/letsencrypt/live/transcoder.evemeta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/transcoder.evemeta.com/privkey.pem;

    # Interim login gate (removed when OIDC + consoles are live).

    # FT-6a tenancy/auth API.
    location /api/tenancy/ {
        proxy_pass http://127.0.0.1:9210/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/upload/ {
        proxy_pass http://127.0.0.1:9211/;
        proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off; client_max_body_size 0;
    }
    location /api/jobs/ {
        proxy_pass http://127.0.0.1:9212/;
        proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;
    }
    location /api/telemetry/ {
        proxy_pass http://127.0.0.1:9213/;
        proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off; proxy_read_timeout 3600s; proxy_set_header Connection "";
        proxy_http_version 1.1;
    }


    # Static maintenance root, served through the access phase so the
    # basic-auth gate above actually applies (a bare `return` would bypass it).
    root /var/www/aether-console;
    location / { try_files $uri $uri/ /index.html; }
}
